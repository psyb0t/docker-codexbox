[extend]
useDefault = true

[[allowlists]]
description = "Ignored local test, audit, cache, and virtual-environment state"
paths = [
  '''(^|/)\.testing(?:/|$)''',
  '''(^|/)\.secaudit(?:/|$)''',
  '''(^|/)codexbox/\.venv(?:/|$)''',
  '''(^|/)codexbox/\.pytest_cache(?:/|$)''',
  '''(^|/)codexbox/\.ruff_cache(?:/|$)''',
  '''(^|/)codexbox/codexbox/__pycache__(?:/|$)''',
  '''(^|/)codexbox/tests/__pycache__(?:/|$)''',
]
