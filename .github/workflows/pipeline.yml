name: pipeline

# Every branch push runs lint and the credential-free tests. A push to main
# then builds both image variants and publishes :latest, :latest-full and the
# per-commit SHA tags. A v* tag waits for that commit's main run to succeed,
# promotes the same images to the release tags without rebuilding, cuts the
# GitHub release, then publishes the skill and plugin to ClawHub and the
# server listing to the MCP Registry.
on: [push]

permissions: {}

jobs:
  # make lint and make test-ci run everything in containers, so the runner
  # needs only Docker. The e2e suite needs credentials and stays local.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-ci"

  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # The called workflow builds only on main/master and tags, so other branches
  # stop after the code job.
  call-docker-image-workflow:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/codexbox
      push_sha_tag: true
      create_release: false
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high"
      cache_mode: "min"
      # Report scan findings to the Security tab but don't fail the run, so the
      # publish jobs below can depend on this workflow succeeding.
      scan_fail_build: false
      # Both variants inherit separate shared Aicodebox bases and build in parallel.
      build_targets: '[{"file":"Dockerfile","tag_suffix":""},{"file":"Dockerfile.full","tag_suffix":"-full"}]'
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master
    with:
      timeout_minutes: 180

  docker-promote:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/codexbox
      target_platforms: "linux/amd64,linux/arm64"
      build_targets: '[{"file":"Dockerfile","tag_suffix":""},{"file":"Dockerfile.full","tag_suffix":"-full"}]'
      promote_on_tag: true
      # The release job below cuts the release from the tag's own notes.
      create_release: false
      scan_severity: "high"
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [docker-promote]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Publish the skill (.agents/skills/) and the OpenClaw MCP bridge
  # (.agents/plugins/) once the release and its images exist.
  publish-to-clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["codexbox"]'
      plugin_names: '["codexbox"]'
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # secretless OIDC auth to the registry
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master
